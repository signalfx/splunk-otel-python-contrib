---
apiVersion: v1
kind: ConfigMap
metadata:
  name: langchain-travel-planner-config
  namespace: travel-planner
data:
  OPENAI_MODEL: "gpt-4o-mini"
  OPENAI_API_VERSION: "2024-12-01-preview"
  LLM_BASE_URL: "https://<your-openai-endpoint>/openai/deployments"
  LLM_TOKEN_URL: "https://<your-token-url>/oauth2/default/v1/token"
  LLM_APP_KEY: "<your-app-key>"
  OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: "DELTA"
  OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "true"
  OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT_MODE: "SPAN_AND_EVENT"
  OTEL_INSTRUMENTATION_GENAI_EMITTERS: "span_metric_event,splunk"
  OTEL_INSTRUMENTATION_GENAI_DEBUG: "false"
  OTEL_LOGS_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"
  LITELLM_DROP_PARAMS: "true"

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: langchain-travel-planner
  namespace: travel-planner
  labels:
    app: langchain-travel-planner
spec:
  schedule: "0 */8 * * *"
  timeZone: "America/Los_Angeles"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600

  jobTemplate:
    metadata:
      labels:
        app: langchain-travel-planner
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 2

      template:
        metadata:
          labels:
            app: langchain-travel-planner
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          restartPolicy: Never

          containers:
          - name: langchain-travel-planner
            image: ertserendavga918/travel-planner-ao:v1.1.0
            imagePullPolicy: Always

            envFrom:
            - configMapRef:
                name: langchain-travel-planner-config

            env:
            - name: LLM_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: langgraph-travel-agent-langchain-secrets
                  key: llm-client-id
            - name: LLM_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: langgraph-travel-agent-langchain-secrets
                  key: llm-client-secret
            - name: OTEL_SERVICE_NAME
              value: "travel-planner-ao"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=agent-observability,splunk_ao.project.name=O11y Test Data,splunk_ao.project.id=725dc817-60f8-476e-8ccb-e5fe90542718,splunk_ao.logstream.name=test,splunk_ao.logstream.id=2585dd2a-ea2d-4b90-b2e7-61eec41203f0,galileo.project.name=O11y Test Data,galileo.logstream.name=test"
            - name: SPLUNK_OTEL_AGENT
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(SPLUNK_OTEL_AGENT):34317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: HOME
              value: "/tmp"

            resources:
              requests:
                memory: "256Mi"
                cpu: "100m"
              limits:
                memory: "512Mi"
                cpu: "500m"

            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 1000
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: false
