[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "splunk-otel-instrumentation-bedrock"
dynamic = ["version"]
description = "OpenTelemetry AWS Bedrock Runtime instrumentation"
readme = "README.rst"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
  { name = "Splunk", email = "o11y-gdi@splunk.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "opentelemetry-api >= 1.37",
  "opentelemetry-instrumentation >= 0.58b0",
  "opentelemetry-semantic-conventions >= 0.58b0",
  "splunk-otel-util-genai >= 0.1.9",
  "wrapt >= 1.14.0, < 2.0.0",
]

[project.optional-dependencies]
instruments = [
  "boto3 >= 1.34.0",
]
test = [
  "boto3 >= 1.34.0",
  "pytest >= 7.0.0",
  "pytest-cov >= 4.0.0",
]

[project.entry-points.opentelemetry_instrumentor]
bedrock = "opentelemetry.instrumentation.bedrock:BedrockInstrumentor"

[project.urls]
Homepage = "https://github.com/signalfx/splunk-otel-python-contrib/tree/main/instrumentation-genai/opentelemetry-instrumentation-bedrock"
Repository = "https://github.com/signalfx/splunk-otel-python-contrib"

[tool.hatch.version]
path = "src/opentelemetry/instrumentation/bedrock/version.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opentelemetry"]
